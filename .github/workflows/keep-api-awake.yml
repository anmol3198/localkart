# Render's free plan puts the API to sleep after 15 idle minutes, and waking it can take a minute or more.
# Pinging the health check every 10 minutes keeps it awake (the free plan's monthly hours cover one
# always-on service). GitHub may delay or skip scheduled runs when it is busy, and pauses them after
# 60 days without commits; re-enable it from the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors https://https-localkart-onrender-com.onrender.com/api/health
