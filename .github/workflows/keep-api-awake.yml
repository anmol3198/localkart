# Backup waker for the free Render API, which sleeps after 15 idle minutes and can take a couple of minutes to wake.
# GitHub runs free scheduled jobs late and irregularly (often hours apart), so a dedicated pinger such as
# cron-job.org or UptimeRobot is the main way to keep it awake; this only helps between their pings.
# A slow wake-up is reported as a warning, not a failure, so it doesn't send failure emails.
# GitHub pauses scheduled jobs after 60 days without commits; re-enable it from the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the health check
        run: |
          if curl --fail --silent --show-error --max-time 150 --retry 2 --retry-delay 15 --retry-all-errors \
               https://https-localkart-onrender-com.onrender.com/api/health; then
            echo
            echo "API is awake"
          else
            echo "::warning::The API did not answer within about 8 minutes. It may still be starting, or Render may be down."
          fi
