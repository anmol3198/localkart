# GitHub opens pull requests to update vulnerable or outdated libraries.
# Also turn on "Dependabot alerts" and "Dependabot security updates" in the repo's Settings > Code security.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      all-minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  # Expo packages must move together (npx expo install --fix), so only security fixes are proposed here.
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
