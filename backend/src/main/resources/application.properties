spring.application.name=localkart-api
server.port=${PORT:5050}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/localkart}
spring.datasource.username=${DB_USER:localkart}
spring.datasource.password=${DB_PASSWORD:localkart}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Customers can discover shops up to this distance away
localkart.max-search-radius-km=${MAX_SEARCH_RADIUS_KM:5}
localkart.cors-origin=${CORS_ORIGIN:*}
# HS256 secret, at least 32 random characters. Required: the API refuses to start without it
# (local dev via ./mvnw spring-boot:test-run sets a throwaway one).
localkart.jwt.secret=${JWT_SECRET:}
localkart.jwt.ttl=7d
# Loads demo shops when the database is empty
localkart.seed.enabled=${SEED:true}
localkart.seed.lat=${SEED_LAT:12.9352}
localkart.seed.lng=${SEED_LNG:77.6245}
localkart.barcode-lookup.enabled=${BARCODE_LOOKUP:true}

# Behind Render/other proxies, use the real client IP from X-Forwarded-For (only trusted from private
# proxy addresses), so rate limits apply per visitor instead of to everyone at once.
server.forward-headers-strategy=native

# First super admin (created on start-up if that email has no account). Remove after the first login if you like.
localkart.admin.email=${SUPER_ADMIN_EMAIL:}
localkart.admin.password=${SUPER_ADMIN_PASSWORD:}
localkart.admin.name=${SUPER_ADMIN_NAME:Super Admin}
