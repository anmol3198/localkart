spring.application.name=localkart-api
server.port=${PORT:5050}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/localkart}
spring.datasource.username=${DB_USER:localkart}
spring.datasource.password=${DB_PASSWORD:localkart}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Customers can discover shops up to this distance away
localkart.max-search-radius-km=${MAX_SEARCH_RADIUS_KM:5}
localkart.cors-origin=${CORS_ORIGIN:*}
# HS256 secret: must be at least 32 characters
localkart.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production!!}
localkart.jwt.ttl=7d
# Loads demo shops when the database is empty
localkart.seed.enabled=${SEED:true}
localkart.seed.lat=${SEED_LAT:12.9352}
localkart.seed.lng=${SEED_LNG:77.6245}
localkart.barcode-lookup.enabled=${BARCODE_LOOKUP:true}
